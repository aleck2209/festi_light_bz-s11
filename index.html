<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

		<link rel="preconnect" href="https://fonts.googleapis.com" />

		<link
			href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Fredericka+the+Great&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
		<title>Sape & Lumière</title>
	</head>
	<body>
		<!-- Header et navigation -->
		<header class="header">

			<div class="container-logo">
				<img
					class="logo-icon"
					src="https://res.cloudinary.com/dbm4cyzrb/image/upload/v1787124269/logo_sans_tipo_blanc-removebg-preview_a6uevj.png"
					alt="logo du festival"
				/>
			</div>
			<!-- Navigation -->
			<nav id="nav-bar" class="nav-bar active">
				<ul>
					<li><a href="#accueil">Accueil</a></li>

					<li><a href="#faq">FAQ</a></li>

			<div class="header-btn">

				<button id="btn-close" class="btn-close" type="button"><i class="fa-solid fa-x"></i></button>
			</div>

		<!-- Hero section -->
		<section id="accueil"></section>
		<!-- Main -->
		<main>
			<section id="programme"></section>
			<section id="line-up"></section>
			<section id="billeterie"></section>

		<script src="app.js"></script>
